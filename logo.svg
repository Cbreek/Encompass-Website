<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 52" role="img" aria-label="Encompass Technology Partners">

  <!-- enc -->
  <text x="1" y="36"
    font-family="'Arial Black','Arial Bold',Gadget,sans-serif"
    font-size="34" font-weight="900"
    fill="#C41E3A">enc</text>

  <!-- Compass rose replacing O (center x=80, y=21 — centered with cap-height of text) -->
  <g transform="translate(80,21)">
    <!-- Ring -->
    <circle r="13" fill="none" stroke="#C41E3A" stroke-width="1.4"/>
    <!-- N spike -->
    <polygon points="0,-18 3.2,-9 -3.2,-9" fill="#C41E3A"/>
    <!-- S spike -->
    <polygon points="0,18 3.2,9 -3.2,9" fill="#C41E3A"/>
    <!-- E spike -->
    <polygon points="18,0 9,3.2 9,-3.2" fill="#C41E3A"/>
    <!-- W spike -->
    <polygon points="-18,0 -9,3.2 -9,-3.2" fill="#C41E3A"/>
    <!-- Diagonal tick marks -->
    <line x1="8" y1="-8" x2="4" y2="-4"   stroke="#C41E3A" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="8" y1="8"  x2="4" y2="4"    stroke="#C41E3A" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-8" y1="8" x2="-4" y2="4"   stroke="#C41E3A" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-8" y1="-8" x2="-4" y2="-4" stroke="#C41E3A" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle r="2.5" fill="#C41E3A"/>
  </g>

  <!-- mpass -->
  <text x="105" y="36"
    font-family="'Arial Black','Arial Bold',Gadget,sans-serif"
    font-size="34" font-weight="900"
    fill="#C41E3A">mpass</text>

  <!-- TECHNOLOGY PARTNERS LLC — white for dark nav/footer background -->
  <text x="2" y="49"
    font-family="Arial,Helvetica,sans-serif"
    font-size="8.5" font-weight="500"
    fill="#ffffff" letter-spacing="2.2">TECHNOLOGY PARTNERS LLC</text>

</svg>
